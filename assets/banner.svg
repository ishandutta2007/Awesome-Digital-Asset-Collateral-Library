<svg fill="none" viewBox="0 0 1200 420" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Tech Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#161233"/>
    </linearGradient>

    <!-- Glowing Accents -->
    <radialGradient id="orbGlow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbGlow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbGlow3" cx="50%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>

    <!-- CSS Animation Styles -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(7px) rotate(-1.5deg); }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -80; }
      }
      @keyframes cardShimmer {
        0% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 0.9; }
        100% { stroke-opacity: 0.3; }
      }

      .pulse-1 { animation: pulseGlow 7s ease-in-out infinite; transform-origin: 200px 100px; }
      .pulse-2 { animation: pulseGlow 9s ease-in-out infinite alternate; transform-origin: 1000px 300px; }
      .float-box-1 { animation: floatSlow 5s ease-in-out infinite; }
      .float-box-2 { animation: floatReverse 6s ease-in-out infinite; }
      .dash-line { stroke-dasharray: 6 6; animation: dashAnim 20s linear infinite; }
      .pill-card { animation: cardShimmer 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="16" fill="url(#grid)"/>

  <!-- Dynamic Glowing Background Ambient Orbs (Kept behind everything) -->
  <circle class="pulse-1" cx="240" cy="110" r="280" fill="url(#orbGlow1)"/>
  <circle class="pulse-2" cx="960" cy="300" r="260" fill="url(#orbGlow2)"/>
  <circle cx="600" cy="390" r="240" fill="url(#orbGlow3)"/>

  <!-- Subtle Animated Connecting Network Circuit Lines in Background -->
  <g opacity="0.35" class="dash-line">
    <path d="M 80 180 Q 300 90 600 130 T 1120 160" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
    <path d="M 120 280 Q 400 360 700 300 T 1080 270" stroke="#818cf8" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Decorative Floating Peripheral Badges (Placed safely on sides, not overlapping text) -->
  <g class="float-box-1" transform="translate(60, 60)">
    <rect width="170" height="46" rx="23" fill="rgba(15, 23, 42, 0.7)" stroke="url(#badgeBorder)" stroke-width="1.2" class="pill-card"/>
    <circle cx="25" cy="23" r="6" fill="#38bdf8"/>
    <text x="42" y="28" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Enterprise DAM</text>
  </g>

  <g class="float-box-2" transform="translate(970, 70)">
    <rect width="170" height="46" rx="23" fill="rgba(15, 23, 42, 0.7)" stroke="url(#badgeBorder)" stroke-width="1.2" class="pill-card"/>
    <circle cx="25" cy="23" r="6" fill="#ec4899"/>
    <text x="42" y="28" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Brand Portals</text>
  </g>

  <g class="float-box-2" transform="translate(60, 310)">
    <rect width="180" height="46" rx="23" fill="rgba(15, 23, 42, 0.7)" stroke="url(#badgeBorder)" stroke-width="1.2" class="pill-card"/>
    <circle cx="25" cy="23" r="6" fill="#10b981"/>
    <text x="42" y="28" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Open-Source Core</text>
  </g>

  <g class="float-box-1" transform="translate(960, 310)">
    <rect width="180" height="46" rx="23" fill="rgba(15, 23, 42, 0.7)" stroke="url(#badgeBorder)" stroke-width="1.2" class="pill-card"/>
    <circle cx="25" cy="23" r="6" fill="#f59e0b"/>
    <text x="42" y="28" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Sales Enablement</text>
  </g>

  <!-- Foreground Content: Unobstructed, Crisp, High Contrast -->
  <g id="foreground-content">
    <!-- Top Pill Category Header -->
    <g transform="translate(450, 48)">
      <rect width="300" height="34" rx="17" fill="rgba(30, 41, 59, 0.85)" stroke="#38bdf8" stroke-width="1"/>
      <text x="150" y="22" fill="#38bdf8" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">CURATED AWESOME REPO</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Digital Asset Collateral Library
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="600" y="195" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500">
      Enterprise Digital Asset Management (DAM), Brand Hubs &amp; Sales Content Enablement
    </text>

    <!-- Tagline & Highlights -->
    <text x="600" y="235" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      Verified SaaS Solutions &amp; Sovereign Open-Source Projects &bull; Market Dynamics &bull; Transparent Pricing
    </text>

    <!-- Feature Attribute Badges Bottom Row -->
    <g transform="translate(320, 275)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <rect width="165" height="36" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
        <text x="82" y="23" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">⚡ AI Metadata Tagging</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(195, 0)">
        <rect width="170" height="36" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
        <text x="85" y="23" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">🛡️ Asset Governance</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(395, 0)">
        <rect width="165" height="36" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
        <text x="82" y="23" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">📊 Deal &amp; Asset Analytics</text>
      </g>
    </g>

    <!-- Bottom Verification Line -->
    <text x="600" y="375" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
      MAIN-BRANCH VERIFIED &bull; COMMUNITY CURATED &bull; CONTINUOUSLY UPDATED
    </text>
  </g>
</svg>
